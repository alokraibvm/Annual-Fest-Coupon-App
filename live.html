<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172554">
    <title>Live Sheet Value</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="live.css">
    <script src="live.js" defer></script>
  </head>
  <body>
    <main class="live-shell">
      <section class="value-panel" aria-live="polite">
        <p id="label" class="label">Entries!D2</p>
        <h1 id="value">Loading...</h1>
        <p id="updated" class="updated"></p>
        <button id="refreshButton" type="button">Refresh</button>
        <p id="message" class="message"></p>
      </section>
    </main>
  </body>
</html>
